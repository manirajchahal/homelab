# Serve the REST API (-w) instead of the XML-RPC server (-s), bound to the LAN
# address so the dashboard containers can reach it. --disable-webui keeps this
# to the JSON API only: Homepage does not need Glances' own web UI.
[Service]
ExecStart=
ExecStart=/usr/bin/glances -w --bind 192.168.4.53 --disable-webui
