#Uptime Kuma, Scrutiny, Jellystat, ntfy, Paperless-ngx
arch: amd64
cores: 4
features: nesting=1
hostname: services
memory: 4096
nameserver: 192.168.4.1
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.4.1,ip=192.168.4.4/22,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-103-disk-0,size=32G
swap: 1024
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
