arch: amd64
cores: 6
dev0: /dev/nvidia0,mode=0666
dev1: /dev/nvidiactl,mode=0666
dev2: /dev/nvidia-uvm,mode=0666
dev3: /dev/nvidia-uvm-tools,mode=0666
features: nesting=1,keyctl=1
hostname: arr-stack
memory: 32768
mp0: local-lvm:vm-100-disk-1,mp=/data,backup=0,size=1400G
nameserver: 192.168.4.1
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.4.1,ip=192.168.4.2/22,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-100-disk-0,size=64G
swap: 512
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
