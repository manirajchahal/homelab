#Valheim dedicated server (crossplay, 2x resources)
arch: amd64
cores: 4
features: nesting=1
hostname: valheim
memory: 8192
nameserver: 192.168.4.1
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.4.1,ip=192.168.4.5/22,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-104-disk-0,size=32G
swap: 1024
unprivileged: 1
